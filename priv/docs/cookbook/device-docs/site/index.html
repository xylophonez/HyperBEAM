<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Standalone HyperBEAM device documentation">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)">
    <title>HyperBEAM Device Docs</title>
    <script>
      (function () {
        var theme = localStorage.getItem('device-docs-theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
        if (/Mac|iPhone|iPad|iPod/.test(navigator.platform)) {
          document.documentElement.classList.add('os-mac');
        }
      })();
    </script>
    <link rel="stylesheet" href="./assets/fonts.css">
    <link rel="stylesheet" href="./assets/docsify-vue.css">
    <link rel="stylesheet" href="./assets/prism.css">

    <style>
      :root { --theme-color: #0d0d0d !important; }
      html[data-theme='dark'] { --theme-color: #f9f9f9 !important; }
    </style>
  </head>

        </div>
        <div class="site-header-nav-zone" id="site-header-nav-zone">
          <nav class="site-header-nav" id="site-header-nav" aria-label="Documentation sections">
            <a class="nav-link" href="#/">Home</a>
          </nav>
          <svg class="nav-megamenu-bridge" id="nav-megamenu-bridge" aria-hidden="true">
            <path></path>
          </svg>
          <div class="nav-megamenu" id="nav-megamenu" aria-hidden="true">
            <div class="nav-megamenu-panel" id="nav-megamenu-panel" role="menu">

        <div class="site-header-actions">
          <button

              <path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/>

            aria-label="Open sections menu"
            aria-expanded="false"
            aria-controls="mobile-nav-panel"
          >
            <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
              <path d="M40,88a8,8,0,0,1,8-8H208a8,8,0,0,1,0,16H48A8,8,0,0,1,40,88Zm0,80a8,8,0,0,1,8-8H168a8,8,0,0,1,0,16H48A8,8,0,0,1,40,168Z"/>

            <svg class="theme-icon-light" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
              <path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/>
            </svg>
            <svg class="theme-icon-dark" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
              <path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,39A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,39-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26.6,88,88,0,0,0,110.5,110.5A89,89,0,0,1,188.9,190.34Z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>
    <div class="mobile-nav-drawer" id="mobile-nav-drawer" aria-hidden="true">
      <div class="mobile-nav-backdrop" data-mobile-nav-close></div>
      <nav class="mobile-nav-panel" id="mobile-nav-panel" aria-label="Documentation sections">
        <div class="mobile-nav-panel-header">
          <span class="mobile-nav-panel-title">Sections</span>
          <button type="button" class="mobile-nav-close" data-mobile-nav-close aria-label="Close menu">
            <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
              <path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/>
            </svg>
          </button>
        </div>
        <div class="mobile-nav-panel-body" id="mobile-nav-body">
          <div class="mobile-nav-tabs" id="mobile-nav-tabs">
            <a class="mobile-nav-home" href="#/">Home</a>
          </div>
          <div class="mobile-nav-list" id="mobile-nav-list"></div>
        </div>
      </nav>
    </div>
    <div class="mobile-sidebar-backdrop" id="mobile-sidebar-backdrop" data-mobile-sidebar-close></div>
    <div
      class="search-modal"
      id="search-modal"
      hidden
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-label="Search documentation"
    >
      <div class="search-modal-backdrop" data-search-close></div>
      <div class="search-modal-panel">
        <div class="site-search-host" id="site-search-host"></div>
      </div>
    </div>
    <div id="app"></div>
    <script>
      (function initSiteNav() {
        var nav = document.getElementById('site-header-nav');
        var navZone = document.getElementById('site-header-nav-zone');
        var megamenu = document.getElementById('nav-megamenu');
        var megamenuPanel = document.getElementById('nav-megamenu-panel');
        var megamenuSections = document.getElementById('nav-megamenu-sections');
        var megamenuFooter = document.getElementById('nav-megamenu-footer');
        var megamenuBridge = document.getElementById('nav-megamenu-bridge');
        var mobileNavBody = document.getElementById('mobile-nav-body');
        var mobileNavTabs = document.getElementById('mobile-nav-tabs');
        var mobileNavList = document.getElementById('mobile-nav-list');
        var mobileNavDrawer = document.getElementById('mobile-nav-drawer');
        var mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        var mobileSidebarToggle = document.getElementById('mobile-sidebar-toggle');
        var mobileSidebarBackdrop = document.getElementById('mobile-sidebar-backdrop');
        if (!nav || !navZone || !megamenu) return;

        var chevronSvg = '<svg class="nav-megamenu-chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6 4.5 9.5"/></svg>';
        var activeTrigger = null;
        var navMedia = window.matchMedia('(max-width: 1000px)');
        var desktopHoverMedia = window.matchMedia('(hover: hover) and (min-width: 1001px)');

        function isMobileNav() {
          return navMedia.matches;
        }

        function isDesktopHoverNav() {
          return desktopHoverMedia.matches;
        }

        function closeMegamenu() {
          megamenu.classList.remove('open');
          megamenu.setAttribute('aria-hidden', 'true');
          navZone.classList.remove('megamenu-open');
          activeTrigger = null;
          nav.querySelectorAll('.nav-megamenu-trigger').forEach(function (trigger) {
            trigger.classList.remove('hovering');
            trigger.setAttribute('aria-expanded', 'false');
          });
          megamenuSections.querySelectorAll('.nav-megamenu-section').forEach(function (sectionEl) {
            sectionEl.classList.remove('active');
          });
          if (megamenuSections) megamenuSections.style.height = '0px';
          updateMegamenuBridge();
        }

        function updateMegamenuFooter(section) {
          if (!megamenuFooter) return;
          megamenuFooter.innerHTML = '';
          if (section.home) {
            var footerLink = document.createElement('a');
            footerLink.className = 'nav-megamenu-footer-link';
            footerLink.href = '#' + section.home;
            footerLink.textContent = 'View all ' + section.label;
            footerLink.addEventListener('click', closeMegamenu);
            megamenuFooter.appendChild(footerLink);
          }
        }

        function measureMegamenuSection(sectionEl) {
          if (!sectionEl) return 0;
          var previous = {
            position: sectionEl.style.position,
            visibility: sectionEl.style.visibility,
            opacity: sectionEl.style.opacity,
            pointerEvents: sectionEl.style.pointerEvents,
            display: sectionEl.style.display
          };
          sectionEl.style.position = 'absolute';
          sectionEl.style.visibility = 'hidden';
          sectionEl.style.opacity = '0';
          sectionEl.style.pointerEvents = 'none';
          sectionEl.style.display = 'block';
          var height = sectionEl.offsetHeight;
          sectionEl.style.position = previous.position;
          sectionEl.style.visibility = previous.visibility;
          sectionEl.style.opacity = previous.opacity;
          sectionEl.style.pointerEvents = previous.pointerEvents;
          sectionEl.style.display = previous.display;
          return height;
        }

        function setMegamenuSectionsHeight(height, animate) {
          if (!megamenuSections) return;
          if (!animate) {
            megamenuSections.style.height = height + 'px';
            window.requestAnimationFrame(updateMegamenuBridge);
            return;
          }

          window.requestAnimationFrame(function () {
            megamenuSections.style.height = height + 'px';
            updateMegamenuBridge();
          });
        }

        function showMegamenuSection(section, animate) {
          var next = megamenuSections.querySelector('[data-section="' + section.id + '"]');
          var current = megamenuSections.querySelector('.nav-megamenu-section.active');
          if (!next) return;

          if (next === current) {
            updateMegamenuFooter(section);
            return;
          }

          var targetHeight = measureMegamenuSection(next);
          var shouldAnimate = animate && megamenu.classList.contains('open') && current;

          if (shouldAnimate) {
            megamenuSections.style.height = megamenuSections.getBoundingClientRect().height + 'px';
          }

          if (current) current.classList.remove('active');
          next.classList.add('active');
          updateMegamenuFooter(section);
          setMegamenuSectionsHeight(targetHeight, shouldAnimate);
        }

        function openMegamenu(section, trigger) {
          if (!isDesktopHoverNav()) return;
          var wasOpen = megamenu.classList.contains('open');
          activeTrigger = trigger;
          megamenu.classList.add('open');
          megamenu.setAttribute('aria-hidden', 'false');
          navZone.classList.add('megamenu-open');
          nav.querySelectorAll('.nav-megamenu-trigger').forEach(function (btn) {
            var isActive = btn === trigger;
            btn.classList.toggle('hovering', isActive);
            btn.setAttribute('aria-expanded', String(isActive));
          });
          showMegamenuSection(section, wasOpen);
        }

        function updateMegamenuBridge() {
          var path = megamenuBridge?.querySelector('path');
          var trigger = activeTrigger;
          if (!path || !megamenuBridge || !megamenuPanel || !trigger || !megamenu.classList.contains('open') || !isDesktopHoverNav()) {
            if (path) {
              path.setAttribute('d', '');
              path.style.pointerEvents = 'none';
            }
            return;
          }

          var zoneRect = navZone.getBoundingClientRect();
          var triggerRect = trigger.getBoundingClientRect();
          var panelRect = megamenuPanel.getBoundingClientRect();
          var width = Math.ceil(Math.max(zoneRect.width, panelRect.right - zoneRect.left));
          var height = Math.ceil(Math.max(zoneRect.height, panelRect.bottom - zoneRect.top));

          megamenuBridge.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
          megamenuBridge.style.width = width + 'px';
          megamenuBridge.style.height = height + 'px';

          var triggerLeft = triggerRect.left - zoneRect.left;
          var triggerRight = triggerRect.right - zoneRect.left;
          var triggerBottom = triggerRect.bottom - zoneRect.top;
          var panelLeft = panelRect.left - zoneRect.left;
          var panelRight = panelRect.right - zoneRect.left;
          var panelTop = panelRect.top - zoneRect.top;

          path.setAttribute(
            'd',
            'M ' + triggerLeft + ' ' + triggerBottom +
            ' L ' + triggerRight + ' ' + triggerBottom +
            ' L ' + panelRight + ' ' + panelTop +
            ' L ' + panelLeft + ' ' + panelTop + ' Z'
          );
          path.style.pointerEvents = 'all';
        }

        function bindMegamenu(sectionData) {
          navZone.addEventListener('mouseleave', function () {
            if (!isDesktopHoverNav()) return;
            closeMegamenu();
          });

          nav.querySelectorAll('.nav-megamenu-trigger').forEach(function (trigger) {
            var sectionId = trigger.getAttribute('data-section');
            var section = sectionData.find(function (entry) { return entry.id === sectionId; });
            if (!section) return;

            trigger.addEventListener('mouseenter', function () {
              if (!isDesktopHoverNav()) return;
              openMegamenu(section, trigger);
            });

            trigger.addEventListener('click', function () {
              closeMegamenu();
            });
          });

          megamenu.querySelectorAll('a[href^="#"]').forEach(function (link) {
            link.addEventListener('click', closeMegamenu);
          });

          document.addEventListener('click', function (e) {
            if (!e.target.closest('#site-header-nav-zone')) closeMegamenu();
          });

          document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeMegamenu();
          });

          window.addEventListener('resize', function () {
            window.requestAnimationFrame(function () {
              var activeSection = megamenuSections.querySelector('.nav-megamenu-section.active');
              if (activeSection) {
                megamenuSections.style.height = measureMegamenuSection(activeSection) + 'px';
              }
              updateMegamenuBridge();
            });
          }, { passive: true });

          if (megamenuSections) {
            megamenuSections.addEventListener('transitionend', function (e) {
              if (e.propertyName !== 'height') return;
              updateMegamenuBridge();
            });
          }

          navMedia.addEventListener('change', function () {
            if (!isDesktopHoverNav()) closeMegamenu();
          });
        }

        function closeMobileNav() {
          if (!mobileNavDrawer) return;
          mobileNavDrawer.classList.remove('open');
          mobileNavDrawer.setAttribute('aria-hidden', 'true');
          mobileMenuToggle?.setAttribute('aria-expanded', 'false');
          document.body.classList.remove('mobile-nav-open');
        }

        function openMobileNav() {
          if (!mobileNavDrawer) return;
          closeMobileSidebar();
          mobileNavDrawer.classList.add('open');
          mobileNavDrawer.setAttribute('aria-hidden', 'false');
          mobileMenuToggle?.setAttribute('aria-expanded', 'true');
          document.body.classList.add('mobile-nav-open');
          mobileNavBody?.querySelectorAll('.mobile-nav-section.active').forEach(function (sectionEl) {
            sectionEl.classList.add('open');
            sectionEl.querySelector('.mobile-nav-section-trigger')?.setAttribute('aria-expanded', 'true');
          });
        }

        function closeMobileSidebar() {
          document.body.classList.remove('mobile-sidebar-open');
          mobileSidebarToggle?.setAttribute('aria-expanded', 'false');
        }

        function openMobileSidebar() {
          closeMobileNav();
          document.body.classList.add('mobile-sidebar-open');
          mobileSidebarToggle?.setAttribute('aria-expanded', 'true');
        }

        window.__closeMobileOverlays = function () {
          closeMobileNav();
          closeMobileSidebar();
        };

        function bindMobileChrome() {
          mobileMenuToggle?.addEventListener('click', function () {
            if (mobileNavDrawer?.classList.contains('open')) closeMobileNav();
            else openMobileNav();
          });

          mobileSidebarToggle?.addEventListener('click', function () {
            if (document.body.classList.contains('mobile-sidebar-open')) closeMobileSidebar();
            else openMobileSidebar();
          });

          mobileNavDrawer?.querySelectorAll('[data-mobile-nav-close]').forEach(function (el) {
            el.addEventListener('click', closeMobileNav);
          });

          mobileSidebarBackdrop?.addEventListener('click', closeMobileSidebar);

          document.addEventListener('keydown', function (e) {
            if (e.key !== 'Escape') return;
            closeMobileNav();
            closeMobileSidebar();
          });

          navMedia.addEventListener('change', function () {
            if (!isMobileNav()) {
              closeMobileNav();
              closeMobileSidebar();
            }
          });
        }

        function setActiveNav(path) {
          var normalized = (path || '/').replace(/^\//, '').split('?')[0].split('#')[0];
          nav.querySelectorAll('.nav-megamenu-trigger').forEach(function (trigger) {
            var section = trigger.getAttribute('data-section');
            var active = section && (normalized === section || normalized.indexOf(section + '/') === 0);
            trigger.classList.toggle('active', active);
          });
          nav.querySelector('.nav-link')?.classList.toggle('active', !normalized || normalized === 'index.md');
          mobileNavBody?.querySelector('.mobile-nav-home')?.classList.toggle('active', !normalized || normalized === 'index.md');
          mobileNavBody?.querySelectorAll('.mobile-nav-section').forEach(function (sectionEl) {
            var section = sectionEl.getAttribute('data-section');
            var active = section && (normalized === section || normalized.indexOf(section + '/') === 0);
            sectionEl.classList.toggle('active', active);
          });
          mobileNavBody?.querySelectorAll('.mobile-nav-tab').forEach(function (tab) {
            var section = tab.getAttribute('data-section');
            var active = section && (normalized === section || normalized.indexOf(section + '/') === 0);
            tab.classList.toggle('active', active);
          });
        }

        window.__updateSiteNavActive = setActiveNav;

        function renderMobileNav(data) {
          if (!mobileNavBody || !mobileNavList || !mobileNavTabs) return;
          mobileNavList.querySelectorAll('.mobile-nav-section').forEach(function (el) {
            el.remove();
          });
          mobileNavTabs.querySelectorAll('.mobile-nav-tab').forEach(function (el) {
            el.remove();
          });

          data.sections.forEach(function (section) {
            var sectionHome = section.home || (section.items[0] && section.items[0].href) || '/';
            var tab = document.createElement('a');
            tab.className = 'mobile-nav-tab';
            tab.href = '#' + sectionHome;
            tab.setAttribute('data-section', section.id);
            tab.textContent = section.label;
            tab.addEventListener('click', closeMobileNav);
            mobileNavTabs.appendChild(tab);

            var block = document.createElement('div');
            block.className = 'mobile-nav-section';
            block.setAttribute('data-section', section.id);

            var trigger = document.createElement('button');
            trigger.type = 'button';
            trigger.className = 'mobile-nav-section-trigger';
            trigger.setAttribute('aria-expanded', 'false');
            trigger.innerHTML = '<span>' + section.label + '</span>' + chevronSvg;

            var panel = document.createElement('div');
            panel.className = 'mobile-nav-section-panel';

            section.items.forEach(function (item) {
              var link = document.createElement('a');
              link.className = 'mobile-nav-link';
              link.href = '#' + item.href;
              link.textContent = item.title;
              link.addEventListener('click', closeMobileNav);
              panel.appendChild(link);

              if (item.children && item.children.length) {
                var sublinks = document.createElement('div');
                sublinks.className = 'mobile-nav-sublinks';
                item.children.forEach(function (child) {
                  var childLink = document.createElement('a');
                  childLink.className = 'mobile-nav-sublink';
                  childLink.href = '#' + child.href;
                  childLink.textContent = child.title;
                  childLink.addEventListener('click', closeMobileNav);
                  sublinks.appendChild(childLink);
                });
                panel.appendChild(sublinks);
              }
            });

            trigger.addEventListener('click', function () {
              var isOpen = block.classList.contains('open');
              mobileNavBody.querySelectorAll('.mobile-nav-section.open').forEach(function (other) {
                if (other !== block) {
                  other.classList.remove('open');
                  other.querySelector('.mobile-nav-section-trigger')?.setAttribute('aria-expanded', 'false');
                }
              });
              block.classList.toggle('open', !isOpen);
              trigger.setAttribute('aria-expanded', String(!isOpen));
            });

            block.appendChild(trigger);
            block.appendChild(panel);
            mobileNavList.appendChild(block);
          });

          mobileNavBody.querySelector('.mobile-nav-home')?.addEventListener('click', closeMobileNav);
        }

        function buildMegamenuItem(item) {
          if (item.children && item.children.length) {
            var group = document.createElement('div');
            group.className = 'nav-megamenu-item nav-megamenu-group';
            group.setAttribute('role', 'group');

            var titleLink = document.createElement('a');
            titleLink.className = 'nav-megamenu-item-title nav-megamenu-title-link';
            titleLink.href = '#' + item.href;
            titleLink.textContent = item.title;
            group.appendChild(titleLink);

            var sublist = document.createElement('div');
            sublist.className = 'nav-megamenu-sublist';
            item.children.forEach(function (child) {
              var childLink = document.createElement('a');
              childLink.className = 'nav-megamenu-subitem';
              childLink.href = '#' + child.href;
              childLink.textContent = child.title;
              sublist.appendChild(childLink);
            });
            group.appendChild(sublist);

            return group;
          }

          var link = document.createElement('a');
          link.className = 'nav-megamenu-item';
          link.href = '#' + item.href;
          link.setAttribute('role', 'menuitem');

          var title = document.createElement('span');
          title.className = 'nav-megamenu-item-title';
          title.textContent = item.title;
          link.appendChild(title);

          if (item.description) {
            var desc = document.createElement('span');
            desc.className = 'nav-megamenu-item-desc';
            desc.textContent = item.description;
            link.appendChild(desc);
          }

          return link;
        }

                prevLink.className = 'docs-footer-link prev';
                prevLink.href = prev.href;
                prevLink.innerHTML = '<span class="docs-footer-label">Previous</span><span class="docs-footer-title"></span>';
                prevLink.querySelector('.docs-footer-title').textContent = prev.text;
                nav.appendChild(prevLink);
              } else {
                nav.appendChild(document.createElement('span'));
              }

              if (index < links.length - 1) {
                var next = links[index + 1];
                var nextLink = document.createElement('a');
                nextLink.className = 'docs-footer-link next';
                nextLink.href = next.href;
                nextLink.innerHTML = '<span class="docs-footer-label">Next</span><span class="docs-footer-title"></span>';
                nextLink.querySelector('.docs-footer-title').textContent = next.text;
                nav.appendChild(nextLink);
              }

              if (nav.children.length) section.appendChild(nav);
            }

            function syncLayoutForViewport() {
              if (window.matchMedia('(max-width: 1000px)').matches) {
                document.body.classList.add('close');
              } else {
                document.body.classList.remove('close');
                window.__closeMobileOverlays?.();
              }
            }

            function keepSidebarOpen() {
              if (!window.matchMedia('(max-width: 1000px)').matches) {
                document.body.classList.remove('close');
              }
            }

            hook.mounted(function () {
              mountSearch();
              bindSearchModal();
              syncLayoutForViewport();
              updateActiveTab();
              keepSidebarOpen();
              window.addEventListener('resize', syncLayoutForViewport, { passive: true });
              if (!window.__pageTocProgressResizeBound) {
                window.__pageTocProgressResizeBound = true;
                window.addEventListener('resize', function () {
                  var tocEl = document.querySelector('.page-toc');
                  if (!tocEl) return;
                  if (typeof tocEl.__syncActiveTocFromScroll === 'function') {
                    tocEl.__syncActiveTocFromScroll();
                  } else if (typeof tocEl.__updatePageTocProgress === 'function') {
                    tocEl.__updatePageTocProgress();
                  }
                }, { passive: true });
              }
              window.addEventListener('hashchange', function () {
                window.setTimeout(syncSidebarActiveState, 0);
              });
            });

            hook.doneEach(function () {
              mountSearch();
              bindSearchModal();
              updateActiveTab();
              keepSidebarOpen();
              window.__closeMobileOverlays?.();
              addCopyPageButton();
              addCopyButtons();
              addFooterNav();
              addPageToc();
              window.setTimeout(syncSidebarActiveState, 0);
            });
          }
        ]
      };
    </script>
    <script src="./assets/example-runner.js"></script>
    <script>
      (function () {
        var root = document.documentElement;
        var toggle = document.getElementById('theme-toggle');

        toggle?.addEventListener('click', function () {
          var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          localStorage.setItem('device-docs-theme', next);
        });
      })();
    </script>
